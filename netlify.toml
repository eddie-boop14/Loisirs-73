# Netlify configuration for Loisirs 73 — same shape as the 74.
#
# The engine landed long ago, but this file stayed the pre-launch stub
# (publish = ".", no build command), so production served whatever HTML was
# committed instead of the built _site/ tree: research logs unstripped, studio
# unpatched, none of the build-time guarantees applied.
#
# Pre-launch safety does NOT live here — it lives in robots.txt (site-wide
# Disallow under the FLIP-AT-LAUNCH marker) and in the noindex meta that
# build_all injects on every page while that marker exists. Flipping robots.txt
# and rebuilding is the launch action; this file needs no change on that day.

[build]
  publish = "_site"
  command = "python3 scripts/build_all.py"
  # Credit hygiene (ported from the 74): skip the production build entirely
  # when a push only touches reports, markdown or docs — none of those reach
  # _site/. Exit 0 = skip build, exit 1 = build. Diff is against the last
  # DEPLOYED commit ($CACHED_COMMIT_REF).
  ignore = "! git diff --name-only $CACHED_COMMIT_REF $COMMIT_REF | grep -qvE '^(reports/|docs/)|\\.md$'"

# Pretty URLs: serve /slug from /slug.html. force = false, so real files and
# the _redirects file (legal pages, aliases) win over this catch-all.
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

# Cache static assets aggressively
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Catalog index — short cache, regenerated after every integration
[[headers]]
  for = "/catalog-index.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# HTML pages: short cache so updates are visible quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
